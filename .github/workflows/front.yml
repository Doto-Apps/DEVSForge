name: Front CI

on:
  push:
    branches: ["main"]
    paths:
      - "front/**"
      - "simulator/runner/integrations/**"
      - "Taskfile.front.yml"
      - ".github/workflows/front.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "front/**"
      - "simulator/runner/integrations/**"
      - "Taskfile.front.yml"
      - ".github/workflows/front.yml"

env:
  PNPM_VERSION: "10.6.5"
  NODE_VERSION: "24"

jobs:
  front-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            front/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-front-${{ hashFiles('front/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-front-
      - name: Install dependencies
        run: pnpm install
        working-directory: ./front
      - name: Type check
        run: pnpm run typecheck
        working-directory: ./front
      - name: Biome check
        working-directory: ./front
        run: pnpm biome check --diagnostic-level=error
      - name: Tests
        working-directory: ./front
        run: pnpm test
      - uses: docker/setup-buildx-action@v3
      - name: Build static browser language tools
        uses: docker/build-push-action@v6
        with:
          context: .
          file: front/Dockerfile
          target: language-tools
          outputs: type=local,dest=front/public/language-tools
          cache-from: type=gha,scope=browser-language-tools
          cache-to: type=gha,scope=browser-language-tools,mode=max
      - name: Install test browser
        working-directory: ./front
        run: pnpm exec playwright install --with-deps chromium
      - name: Check Python, Go and Java locally in the browser
        working-directory: ./front
        run: node scripts/check-browser-lsp.cjs
      - name: Production build
        working-directory: ./front
        run: pnpm run build
