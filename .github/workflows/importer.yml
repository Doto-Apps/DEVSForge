name: Importer CI
on:
  push:
    branches: [main]
    paths: ['importer/**', '.github/workflows/importer.yml']
  pull_request:
    branches: [main]
    paths: ['importer/**', '.github/workflows/importer.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
        working-directory: importer
      - run: docker build -f importer/Dockerfile -t devsforge-importer-test .
