version: "3"

vars:
  BASE_COORDINATOR_DOCKER_CMD: |
    docker run --rm -t --init --network host \
        -e PATHS_RUNNER_CMD=/tmp/devsforge-runner \
        -e LOG_DIR=/tmp/logs \
        -e PATHS_SIM_ROOT=/tmp/simulations \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v ./build/devsforge-runner:/tmp/devsforge-runner \
        -v ./simulator/runner/integrations:/opt/devsforge/integrations \
        -v ./tmp/unit-tests/simulation:/tmp/simulations \
        -v ./tmp/unit-tests/logs:/tmp/logs \
        -v $(pwd):/app \
        -w /app \
        devsforge-test-simulator:latest \
  BASE_RUNNER_DOCKER_CMD: |
    docker run --rm -t --init --network host \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e LOG_DIR=/tmp/sim-logs \
        -v $(pwd):/app \
        -w /app \
        devsforge-test-runner:latest \
tasks:
  devsimpy:test:
    desc: Run the DEVSimPy adapter tests with the simulator's Python dependencies
    cmds:
      - task: runner:sh
        vars:
          CLI_ARGS: python3 -m unittest discover -s simulator/runner/integrations/devsimpy-python/tests -v

  ms4me:test:
    desc: Run the MS4 Me wrapper tests with the simulator's Java 21 toolchain
    cmds:
      - task: runner:sh
        vars:
          CLI_ARGS: sh -c 'cd simulator/runner/integrations/ms4me-java/wrapper && ./mvnw -B test'

  proto:
    desc: Generate protocol bindings for one integration
    cmds:
      - bash scripts/generate-proto.sh {{.CLI_ARGS}}

  lsp:test:
    desc: Run language-server tests including real engines in Docker
    cmds:
      - docker build --target lsp -f simulator/Dockerfile -t devsforge-lsp-test .
      - docker run --rm --init -e LSP_REAL_SERVERS=1 -e GOMODCACHE=/tmp/test-modules -e GOCACHE=/tmp/test-build -v {{.ROOT_DIR}}:/app:ro -w /app devsforge-lsp-test go test ./simulator/runner/internal/lsp -v -timeout 10m

  format:
    desc: Format all simulator modules (coordinator, runner, shared)
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}} fmt ./simulator/coordinator/... ./simulator/runner/... ./simulator/shared/... {{.CLI_ARGS}}

  lint:
    desc: Lint simulator with golangci-lint
    env:
      GOLANGCI_LINT_CACHE: "{{.GOLANGCI_LINT_CACHE}}"
    vars:
      CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}} run ./simulator/coordinator/... ./simulator/runner/... ./simulator/shared/... {{.CLI_ARGS}}

  build:
    desc: Build all simulator modules
    cmds:
      - go build -v ./simulator/coordinator/... ./simulator/runner/... ./simulator/shared/...

  test:
    desc: Run all simulator tests inside Docker
    cmds:
      - task: runner:sh
        vars:
          CLI_ARGS: go test ./simulator/coordinator/... ./simulator/runner/... ./simulator/shared/... -timeout 10m {{.CLI_ARGS}}

  coordinator:sh:
    interactive: true
    desc: Run coordinator shell inside Docker
    requires:
      vars:
        - name: BUILD
          enum: [N, Y]
    cmds:
      - cmd: |
          echo "Building Docker coordinator image..."
          docker build -f ./simulator/Dockerfile -t devsforge-test-simulator:latest ./
        if: '{{eq .BUILD "Y"}}'
      - cmd: |
          echo "Building Docker runner binary..."
          docker run --rm -v ./:/app -w /app golang:1.26.2 sh -c 'CGO_ENABLED=0 go build -ldflags="-s -w" -o ./build/devsforge-runner -v ./simulator/runner/main.go && chmod 777 ./build/devsforge-runner'
        if: '{{eq .BUILD "Y"}}'

      - echo "Running shell in Docker..."
      - "{{.BASE_COORDINATOR_DOCKER_CMD}} {{.CLI_ARGS}}"

  coordinator:test:
    interactive: true
    desc: Run coordinator tests inside Docker runner image
    requires:
      vars:
        - name: BUILD
          enum: [N, Y]
    cmds:
      - task: coordinator:sh
        vars:
          CLI_ARGS: go test ./simulator/coordinator/... -timeout 30s {{.CLI_ARGS}}

  runner:sh:
    desc: Run shell command inside Docker runner image
    cmds:
      - echo "Building Docker runner image..."
      - docker build --target runner -f ./simulator/Dockerfile -t devsforge-test-runner:latest ./
      - echo "Running tests in Docker..."
      - "{{.BASE_RUNNER_DOCKER_CMD}} {{.CLI_ARGS}}"

  runner:test:
    interactive: true
    desc: Run runner tests inside Docker runner image
    cmds:
      - task: runner:sh
        vars:
          CLI_ARGS: go test ./simulator/runner/... {{.CLI_ARGS}}
