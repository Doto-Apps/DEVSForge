version: "3"

includes:
  front:
    taskfile: Taskfile.front.yml
  back:
    taskfile: Taskfile.back.yml
  simulator:
    taskfile: Taskfile.simulator.yml

vars:
  GOLANGCI_VERSION: v2.11.4
  MIGRATE_VERSION: v4.19.1
  GOLANGCI_LINT_CACHE:
    sh: echo "$(pwd)/.cache/golangci-lint/"

tasks:
  default:
    desc: Print all tasks
    aliases:
      - help
    cmds:
      - cmd: task --list
        silent: true

  setup:
    desc: Install all tools required to dev
    cmds:
      - git config set core.autocrlf false
      - git config set hook.check-commit.command "task pre-commit"
      - git config set --all hook.check-commit.event pre-commit
      - git config set hook.verify-message.command "scripts/commit-msg.sh"
      - git config set --all hook.verify-message.event commit-msg
      - cp .env.dist .env || true
      - cd front && pnpm install
      - echo "✅ Project setup."

  format:
    desc: Format all code (front, back, simulator)
    cmds:
      - task: front:format
      - task: back:format
      - task: simulator:format

  lint:
    desc: Lint all code (front, back, simulator)
    cmds:
      - task: front:check
      - task: back:lint
      - task: simulator:lint

  test:
    desc: Run all tests (back + simulator)
    cmds:
      - task: back:test
      - task: simulator:test

  start:prod:
    desc: Start production environment
    cmds:
      - docker compose -f docker-compose.yml up --pull always

  start:
    desc: Start local environment
    cmds:
      - docker compose -f docker-compose.local.yml up --build

  clean:
    desc: Clean tmp files
    cmds:
      - rm -rf ./tmp

  pre-commit:
    cmds:
      - task: format
      - task: lint
      - git diff --cached --name-only --diff-filter=ACM | xargs -r git add
