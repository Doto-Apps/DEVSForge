services:
  backend:
    image: cosmtrek/air:latest
    env_file:
      - ./.env
    environment:
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /root/.cache/go-build
      SIMULATOR_ADDR: simulator:8080
      LSP_ADDR: http://lsp:8090
      LSP_ALLOWED_ORIGINS: ${LSP_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      INTEGRATIONS_ALLOW_CHANGES: "true"
      INTEGRATIONS_DIR: /app/simulator/runner/integrations
    working_dir: /app/back
    ports:
      - "3000:3000"
    volumes:
      - ./back:/app/back
      - ./go.work:/app/go.work
      - ./go.work.sum:/app/go.work.sum
      - ./simulator:/app/simulator
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./back
          target: /app/back
        - action: sync
          path: ./simulator/shared
          target: /app/simulator/shared

  runner-builder:
    image: golang:1.26.2
    working_dir: /app
    environment:
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /root/.cache/go-build
    volumes:
      - ./go.work:/app/go.work
      - ./go.work.sum:/app/go.work.sum
      - ./simulator:/app/simulator
      - ./back/go.mod:/app/back/go.mod
      - runner-build:/build
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: sh -c "CGO_ENABLED=0 go build -ldflags='-s -w' -o /build/devsforge-runner ./simulator/runner"
    develop:
      watch:
        - action: sync+exec
          path: ./simulator/runner
          target: /app/simulator/runner
          exec:
            working_dir: /app
            command: sh -c "CGO_ENABLED=0 go build -ldflags='-s -w' -o /build/devsforge-runner ./simulator/runner"
        - action: sync+exec
          path: ./simulator/shared
          target: /app/simulator/shared
          exec:
            working_dir: /app
            command: sh -c "CGO_ENABLED=0 go build -ldflags='-s -w' -o /build/devsforge-runner ./simulator/runner"
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
      target: development
    environment:
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /root/.cache/go-build
      PATHS_RUNNER_CMD: /runner-build/devsforge-runner
      INTEGRATIONS_DIR: /app/simulator/runner/integrations
      SHARED_GO_DIR: /app/simulator/shared
    env_file:
      - ./.env
    working_dir: /app/simulator/coordinator
    ports:
      - "8080:8080"
    volumes:
      - ./back/go.mod:/app/back/go.mod
      - ./go.work:/app/go.work
      - ./go.work.sum:/app/go.work.sum
      - ./simulator:/app/simulator
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ./tmp/logs:/tmp/sim-logs
      - ./tmp/simulations:/tmp/simulations
      - runner-build:/runner-build
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      runner-builder:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./simulator/coordinator
          target: /app/simulator/coordinator

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-devsforge}
      POSTGRES_DB: ${DB_NAME:-devsforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test123}
    ports:
      - "5432:5432"
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,kafka.controller=WARN,kafka.log.LogCleaner=WARN,state.change.logger=WARN,kafka.producer.async.DefaultEventHandler=WARN"
    ports:
      - "9092:9092"

  lsp:
    build:
      context: .
      dockerfile: simulator/Dockerfile
      target: lsp
    environment:
      LSP_INTERNAL_TOKEN: ${LSP_INTERNAL_TOKEN:?Run task lsp:setup first}
      LSP_MAX_SESSIONS: ${LSP_MAX_SESSIONS:-6}
      LSP_MAX_JAVA_SESSIONS: ${LSP_MAX_JAVA_SESSIONS:-2}
      LSP_IDLE_SECONDS: ${LSP_IDLE_SECONDS:-900}
      LSP_MAX_INITIALIZATIONS: ${LSP_MAX_INITIALIZATIONS:-2}
    mem_limit: ${LSP_MEMORY_LIMIT:-4g}
    init: true
    restart: unless-stopped
    volumes:
      - ./simulator/runner/integrations:/opt/devsforge/integrations:ro
      - ./simulator/shared:/opt/devsforge/shared:ro

volumes:
  go-mod-cache:
  go-build-cache:
  runner-build:
