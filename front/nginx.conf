server {
    listen       80;
    server_name  default_server;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/json text/javascript application/javascript;

    # Missing tool files must produce an error rather than the SPA's index.html.
    # Keep native Range support for the Java runtime's JAR reads.
    location /language-tools/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        try_files $uri /index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
